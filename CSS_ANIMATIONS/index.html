<!doctype html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="output.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <button
      type="button"
      class="btn-solid theme-primary"
      commandfor="invokerDrawer"
      command="show-modal"
    >
      Open drawer
    </button>


    <button class="btn-solid theme-primary">
      Click me 
    </button>
    <dialog
      class="drawer drawer-start"
      tabindex="-1"
      id="invokerDrawer"
      aria-labelledby="invokerDrawerLabel"
    >
      <div class="drawer-header">
        <h5 class="drawer-title" id="invokerDrawerLabel">Invoker Commands</h5>
        <button
          type="button"
          class="btn-close"
          commandfor="invokerDrawer"
          command="close"
          aria-label="Close"
        ></button>
      </div>
      <div class="drawer-body">
        <p>
          This drawer opens with <code>command="show-modal"</code> and closes
          with <code>command="close"</code>. No Bootstrap JavaScript is
          involved.
        </p>
      </div>
    </dialog>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
